# Genera lib/loopin_engine_bindings_generated.dart a partir del .h:
#   dart run ffigen --config ffigen.yaml
name: LoopinEngineBindings
description: |
  Bindings de `src/loopin_engine.h`.
  Regenerar con `dart run ffigen --config ffigen.yaml`.
output: 'lib/loopin_engine_bindings_generated.dart'
headers:
  entry-points:
    - 'src/loopin_engine.h'
  include-directives:
    - 'src/loopin_engine.h'
preamble: |
  // SPDX-License-Identifier: GPL-3.0-or-later
  // ignore_for_file: always_specify_types, camel_case_types, non_constant_identifier_names
comments:
  style: any
  length: full
